<style>
/* Layout: one centered column like a 학습지 page; the 2×2 범주표 (융합/상반 × 이상/현실) is the core interface. */
:root{
  --bg:#f3f5f8; --paper:#ffffff; --ink:#1c2433; --muted:#5b6577; --line:#d9dee7;
  --accent:#2f4b8a;
  --c-sung:#2f4b8a; --c-ua:#2f7a5a; --c-bi:#9a2f45; --c-gol:#a8661a;
  --ok:#2f7a5a; --bad:#b33a3a;
  --tint:#e8edf6;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121722; --paper:#1a2130; --ink:#e7ebf2; --muted:#9aa4b6; --line:#2d3646;
  --accent:#8fa8e6; --c-sung:#8fa8e6; --c-ua:#6fc39c; --c-bi:#e48a9c; --c-gol:#e0a75c;
  --ok:#6fc39c; --bad:#f08484; --tint:#222b3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121722; --paper:#1a2130; --ink:#e7ebf2; --muted:#9aa4b6; --line:#2d3646;
  --accent:#8fa8e6; --c-sung:#8fa8e6; --c-ua:#6fc39c; --c-bi:#e48a9c; --c-gol:#e0a75c;
  --ok:#6fc39c; --bad:#f08484; --tint:#222b3d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem)}
h2{font-size:1.35rem}
p{margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--muted);font-weight:600}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:none;background:var(--accent);color:var(--paper);padding:12px 20px;border-radius:10px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* 범주표 */
.matrix{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:stretch}
.axis{font-size:.8rem;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.axis.side{writing-mode:horizontal-tb;min-width:44px}
.cell{border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;transition:transform .12s,border-color .12s}
.cell .name{font-family:var(--f-display);font-size:1.45rem;font-weight:700}
.cell .sub{font-size:.85rem;color:var(--muted)}
.cell[data-c="숭고"] .name{color:var(--c-sung)}
.cell[data-c="우아"] .name{color:var(--c-ua)}
.cell[data-c="비장"] .name{color:var(--c-bi)}
.cell[data-c="골계"] .name{color:var(--c-gol)}
button.cell:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent)}
button.cell:disabled{cursor:default}
.cell.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--paper))}
.cell.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.cell.dim{opacity:.45}
.mark{font-size:.8rem;font-weight:600}
.cell.correct .mark{color:var(--ok)} .cell.wrong .mark{color:var(--bad)}

/* 문제 */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tag{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtext{font-size:1.08rem;font-weight:500}
.quote{font-family:var(--f-display);font-size:1.05rem;background:var(--tint);border-radius:10px;padding:14px 16px;line-height:1.8}
.quote .src{display:block;font-family:var(--f-body);font-size:.8rem;color:var(--muted);margin-top:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .quote{min-width:0;display:flex;flex-direction:column;gap:6px}
.pair .quote.modern{background:var(--paper);border:1.5px dashed var(--line);font-family:var(--f-body);font-size:.98rem}
.lbl{font-family:var(--f-body);font-size:.75rem;font-weight:600;letter-spacing:.06em;color:var(--accent)}
.pair-src{font-size:.8rem;color:var(--muted)}
@media (max-width:600px){.pair{grid-template-columns:1fr}}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--line);border-radius:10px;background:var(--paper);padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.txt{display:flex;flex-direction:column;gap:8px}
.ans-input{flex:1 1 200px;min-width:0;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:11px 14px}
.ans-input:focus{outline:none;border-color:var(--accent)}
.ans-input.correct{border-color:var(--ok)} .ans-input.wrong{border-color:var(--bad)}
.hint{border-left:3px solid var(--c-gol);padding:8px 12px;font-size:.95rem;background:color-mix(in srgb,var(--c-gol) 8%,var(--paper));border-radius:0 8px 8px 0}
.fb{border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;border:1.5px solid}
.fb.ok{border-color:var(--ok)} .fb.no{border-color:var(--bad)}
.fb h3{font-size:1.15rem}
.fb.ok h3{color:var(--ok)} .fb.no h3{color:var(--bad)}
.analysis{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
.analysis dt{font-weight:600;color:var(--muted)} .analysis dd{margin:0}

/* 결과 */
.score{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:1.15rem}
.stat span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:10px}
.review li{list-style:none;border-top:1px solid var(--line);padding-top:10px}
.review ul{padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.small{font-size:.88rem}
@media (max-width:480px){
  .card{padding:16px}
  .cell .name{font-size:1.25rem}
  .stats{grid-template-columns:repeat(2,1fr)}
  .axis.side{min-width:32px;font-size:.72rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  {part:2,type:"cat",tag:"고전시가",

   quote:"두터비 파리를 물고 두험 우희 치다라 안자 / 것넌 산 바라보니 백송골이 떠 잇거늘 가슴이 금즉하여 풀덕 뛰여 내닷다가 두험 아래 쟛바지거고나 / 모쳐라 날낸 낼싀만졍 에헐질 번하괘라",
   modern:"두꺼비가 파리를 물고 두엄 더미 위에 뛰어올라 앉아 / 건너편 산을 바라보니 흰 송골매가 떠 있기에 가슴이 섬뜩하여 펄쩍 뛰어 내닫다가 두엄 아래로 자빠졌구나 / 마침 날랜 나였기에 망정이지 (하마터면) 피멍이 들 뻔했구나",
   src:"작자 미상의 사설시조",
   answer:"골계",
   hint:"넘어지고도 큰소리치는 두꺼비의 모습은 누구를 빗댄 것일까요?",
   ideal:"강자로서의 위엄(두꺼비의 허세)",real:"넘어지고도 허세 부리는 꼴",
   explain:"약자 앞에서 큰소리치던 두꺼비(탐관오리)가 강자 앞에서 허둥대다 넘어지고도 허세를 부립니다. 위엄의 공허함을 폭로하는 풍자, 곧 골계미입니다."},
  {part:2,type:"cat",tag:"고전시가",
   text:"다음 시조에 가장 두드러진 미적 범주는?",
   quote:"강호에 봄이 드니 미친 흥이 절로 난다 / 탁료계변에 금린어 안주로다 / 이 몸이 한가하옴도 역군은이샷다",
   modern:"자연에 봄이 찾아오니 억누를 수 없는 흥이 절로 난다 / 막걸리를 마시며 노는 시냇가에서는 싱싱한 물고기가 안주로구나 / 이 몸이 이렇게 한가롭게 지내는 것도 임금의 은혜로다",
   src:"맹사성, 「강호사시가」 제1수",
   answer:"우아",
   hint:"화자는 지금의 삶에 만족하나요, 불만인가요?",
   ideal:"자연 속 한가로운 삶",real:"막걸리와 물고기 안주가 있는 강가",
   explain:"자연 속의 지금 이 생활이 그대로 이상적인 삶으로 누려집니다. 현실 중심의 융합, 곧 우아미입니다."},
  {part:2,type:"cat",tag:"고전시가",
   text:"다음 향가에 가장 두드러진 미적 범주는?",
   quote:"아아, 미타찰에서 만날 나 / 도 닦아 기다리겠노라",
   origLabel:"해독문",
   modern:"아아, 극락세계에서 너를 다시 만날 나는 / 불도를 닦으며 그날을 기다리겠다",
   src:"월명사, 「제망매가」 낙구 (김완진 해독) · 죽은 누이를 떠올리는 장면",
   answer:"숭고",
   hint:"누이의 죽음이라는 현실을 화자는 어떤 가치로 이겨 내나요?",
   ideal:"극락(미타찰)에서의 재회, 불교적 깨달음",real:"누이의 죽음과 슬픔",
   explain:"누이의 죽음이라는 슬픈 현실이 불교적 이상에 의해 감싸 안기고 승화됩니다. 이상 중심의 융합, 곧 숭고미입니다."},
  {part:2,type:"cat",tag:"고전시가",
   text:"다음 향가에 가장 두드러진 미적 범주는?",
   quote:"아아, 잣ㅅ가지 높아 / 눈이라도 덮지 못할 고깔이여",
   origLabel:"해독문",
   modern:"아아, 잣나무 가지처럼 높아서 / 눈조차 덮을 수 없는 화랑(기파랑)이시여",
   src:"충담사, 「찬기파랑가」 낙구 (김완진 해독)",
   answer:"숭고",
   hint:"화자는 기파랑을 어떤 존재로 바라보나요?",
   ideal:"고결한 인격(높은 잣나무)",real:"기파랑이라는 실제 인물",
   explain:"기파랑이라는 현실의 인물이 고결한 이상으로 우러러 예찬됩니다. 이상이 현실을 긍정하는 숭고미입니다."}
];

const app = document.getElementById("app");
let order = [], idx = 0, results = [], answered = false, hintShown = false;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function matrixHTML(interactive){
  const cell = c => {
    const tag = interactive ? "button" : "div";
    return `<${tag} class="cell" data-c="${c}" ${interactive?`type="button" id="cell-${c}"`:""}>
      <span class="name">${c}</span><span class="sub">${CATS[c].sub}</span><span class="mark"></span></${tag}>`;
  };
  return `<div class="matrix" role="group" aria-label="미적 범주표">
    <div></div><div class="axis">이상 중심<br><span class="small">있어야 할 것</span></div><div class="axis">현실 중심<br><span class="small">있는 것</span></div>
    <div class="axis side">융합</div>${cell("숭고")}${cell("우아")}
    <div class="axis side">상반</div>${cell("비장")}${cell("골계")}
  </div>`;
}

function renderStart(){
  app.innerHTML = `
  <header style="display:flex;flex-direction:column;gap:8px">
    <span class="eyebrow">「춘향전」 들어가기 전에</span>
    <h1>미적 범주 판별 퀴즈</h1>
    <p class="muted">‘있어야 할 것(이상)’과 ‘있는 것(현실)’의 관계를 따져 숭고·우아·비장·골계를 구별해 봅시다.</p>
  </header>
  <section class="card">
    <h2>먼저 범주표를 익혀요</h2>
    <p>두 가지만 물으면 됩니다. <b>① 이상과 현실이 하나가 되나(융합), 부딪치나(상반)?</b> <b>② 어느 쪽이 기준인가?</b></p>
    ${matrixHTML(false)}
    <p class="small muted">2부에서는 이 표의 칸을 눌러 답합니다. 우아는 제시문에 직접 나오지 않아 같은 이론 체계로 보충했습니다.</p>
  </section>
  <section class="card">
    <h2>문제 구성</h2>
    <p><b>1부 개념 확인</b> 7문항 · 주관식, 제시문 내용을 떠올려 직접 쓰기</p>
    <p><b>2부 장면 판별</b> 9문항 · 「춘향전」과 고전시가 장면을 보고 범주 고르기 (순서는 매번 섞여요)</p>
    <div class="row"><button class="btn" id="startBtn" type="button">시작하기</button></div>
  </section>`;
  document.getElementById("startBtn").onclick = start;
}

function start(){
  const p1 = QUESTIONS.filter(q=>q.part===1);
  const p2 = shuffle(QUESTIONS.filter(q=>q.part===2));
  order = [...p1,...p2]; idx = 0; results = [];
  renderQ();
}

function lines(s){return esc(s).replace(/ \/ /g,"<br>")}
function quoteHTML(q){
  if(!q.quote) return "";
  if(!q.modern) return `<div class="quote">${lines(q.quote)}<span class="src">${esc(q.src)}</span></div>`;
  return `<div class="pair">
    <div class="quote"><span class="lbl">${q.origLabel||"원문"}</span><span>${lines(q.quote)}</span></div>
    <div class="quote modern"><span class="lbl">현대어 풀이</span><span>${lines(q.modern)}</span></div>
  </div><p class="pair-src">${esc(q.src)}</p>`;
}

function answersHTML(q){
  if(q.type==="cat") return matrixHTML(true);
  if(q.type==="text") return `<form class="txt" id="txtForm" autocomplete="off">
    <label for="ans-input" class="small muted">답을 쓰고 제출을 누르세요 (Enter 키도 됩니다)</label>
    <div class="row"><input id="ans-input" class="ans-input" type="text" placeholder="여기에 답 쓰기"><button class="btn" type="submit" id="submitBtn">제출</button></div>
    <p class="small" id="txtMsg" style="color:var(--bad)"></p></form>`;
  return `<div class="opts">${q.options.map((o,i)=>`<button type="button" class="opt" id="opt-${i}" data-i="${i}">${i+1}. ${esc(o)}</button>`).join("")}</div>`;
}
function norm(s){return String(s).replace(/[\s.,!?'"‘’“”()\[\]]/g,"")}
function grade(q,input){
  const n = norm(input); if(!n) return false;
  if(q.cat && Object.keys(CATS).some(c=>c!==q.cat && n.includes(c))) return false;
  return q.accept.some(a=>n.includes(norm(a)));
}

function renderQ(){
  const q = order[idx]; answered = false; hintShown = false;
  const pct = Math.round(idx/order.length*100);
  app.innerHTML = `
  <div class="top">
    <span class="eyebrow">${q.part===1?"1부 개념 확인":"2부 장면 판별"} · ${idx+1} / ${order.length}</span>
    <span class="tag">${q.tag}</span>
  </div>
  <div class="bar" aria-hidden="true"><span style="width:${pct}%"></span></div>
  <section class="card">
    <p class="qtext">${esc(q.text)}</p>
    ${quoteHTML(q)}
    <div id="answers">${answersHTML(q)}</div>
    <div id="hintBox"></div>
    <div class="row" id="ctrl"><button type="button" class="btn ghost" id="hintBtn">힌트 보기</button></div>
    <div id="fb"></div>
  </section>`;
  document.getElementById("hintBtn").onclick = () => {
    if(hintShown) return; hintShown = true;
    document.getElementById("hintBox").innerHTML = `<p class="hint">💡 ${esc(q.hint)}</p>`.replace("💡 ","힌트 · ");
    document.getElementById("hintBtn").disabled = true;
  };
  if(q.type==="cat"){
    Object.keys(CATS).forEach(c=>document.getElementById("cell-"+c).onclick=()=>answer(c));
  } else if(q.type==="text"){
    const inp = document.getElementById("ans-input");
    document.getElementById("txtForm").onsubmit = e => {
      e.preventDefault();
      if(!inp.value.trim()){document.getElementById("txtMsg").textContent="답을 입력한 뒤 제출하세요.";inp.focus();return;}
      answer(inp.value.trim());
    };
    inp.focus();
  } else {
    q.options.forEach((_,i)=>document.getElementById("opt-"+i).onclick=()=>answer(i));
  }
}

function answer(choice){
  if(answered) return; answered = true;
  const q = order[idx]; const ok = q.type==="text" ? grade(q,choice) : choice===q.answer;
  results.push({q,choice,ok,hint:hintShown});
  if(q.type==="cat"){
    Object.keys(CATS).forEach(c=>{
      const el = document.getElementById("cell-"+c); el.disabled = true;
      if(c===q.answer){el.classList.add("correct");el.querySelector(".mark").textContent="정답"}
      else if(c===choice){el.classList.add("wrong");el.querySelector(".mark").textContent="내 선택"}
      else el.classList.add("dim");
    });
  } else if(q.type==="text"){
    const inp=document.getElementById("ans-input"); inp.readOnly=true; inp.classList.add(ok?"correct":"wrong");
    document.getElementById("submitBtn").disabled=true; document.getElementById("txtMsg").textContent="";
  } else {
    q.options.forEach((_,i)=>{
      const el=document.getElementById("opt-"+i); el.disabled=true;
      if(i===q.answer) el.classList.add("correct"); else if(i===choice) el.classList.add("wrong");
    });
  }
  const ansName = q.type==="mc" ? `${q.answer+1}번` : q.answer;
  const info = q.type==="cat" ? CATS[q.answer] : (q.cat ? CATS[q.cat] : null);
  const catName = q.cat || q.answer;
  document.getElementById("fb").innerHTML = `
  <div class="fb ${ok?"ok":"no"}">
    <h3>${ok?"정답이에요!":"아쉬워요. 정답은 ‘"+esc(ansName)+"’입니다."}</h3>
    ${q.type==="text"?`<p class="small">내 답: <b>${esc(choice)}</b> · 모범 답: <b>${esc(q.answer)}</b>${q.cat?" (‘"+esc(q.cat)+"미’도 정답)":""}${q.note?" · "+esc(q.note):""}</p>`:""}
    ${info?`<dl class="analysis">
      <dt>있어야 할 것</dt><dd>${esc(q.ideal)}</dd>
      <dt>있는 것</dt><dd>${esc(q.real)}</dd>
      <dt>관계</dt><dd>${info.rel} · ${info.lead} 중심 → ${catName} (${info.feel})</dd>
    </dl>`:""}
    <p>${esc(q.explain)}</p>
  </div>`;
  document.getElementById("ctrl").innerHTML = `<button type="button" class="btn" id="nextBtn">${idx+1<order.length?"다음 문제":"결과 보기"}</button>`;
  const nb = document.getElementById("nextBtn"); nb.focus();
  nb.onclick = () => { idx++; idx<order.length ? renderQ() : renderResult(); window.scrollTo({top:0}); };
}

function renderResult(){
  const total = results.length, right = results.filter(r=>r.ok).length;
  const byCat = {}; Object.keys(CATS).forEach(c=>byCat[c]={n:0,ok:0});
  results.filter(r=>r.q.type==="cat").forEach(r=>{byCat[r.q.answer].n++; if(r.ok) byCat[r.q.answer].ok++;});
  const wrong = results.filter(r=>!r.ok);
  const msg = right===total ? "완벽해요! 이제 「춘향전」 속 장면들을 직접 찾아볼 준비가 됐어요."
    : right>=total*0.75 ? "잘했어요. 틀린 문제의 ‘이상’과 ‘현실’을 다시 짚어 보세요."
    : "범주표를 다시 보고, 이상과 현실이 무엇인지부터 찾아보는 연습을 해 봐요.";
  app.innerHTML = `
  <header style="display:flex;flex-direction:column;gap:8px">
    <span class="eyebrow">결과</span>
    <h1>미적 범주 판별 퀴즈</h1>
  </header>
  <section class="card">
    <div class="row" style="gap:14px;align-items:baseline"><span class="score">${right} / ${total}</span><span class="muted">문항 정답</span></div>
    <p>${msg}</p>
    <h3>범주별 정답 (범주표 문항)</h3>
    <div class="stats">${Object.keys(CATS).map(c=>`<div class="stat"><b style="color:var(--c-${{숭고:"sung",우아:"ua",비장:"bi",골계:"gol"}[c]})">${c}</b><span>${byCat[c].ok} / ${byCat[c].n}</span></div>`).join("")}</div>
  </section>
  ${wrong.length?`<section class="card review">
    <h2>틀린 문제 다시 보기</h2>
    <ul>${wrong.map(r=>{
      const q=r.q; const mine = q.type==="mc"?`${r.choice+1}번`:r.choice; const ans=q.type==="mc"?`${q.answer+1}번 (${q.options[q.answer]})`:q.answer;
      return `<li><p class="small muted">${esc(q.tag)}${q.src?" · "+esc(q.src):""}</p>
        <p>${esc(q.quote||q.text)}</p>
        <p class="small">내 답: <b style="color:var(--bad)">${esc(mine)}</b> · 정답: <b style="color:var(--ok)">${esc(ans)}</b></p>
        <p class="small muted">${esc(q.explain)}</p></li>`}).join("")}</ul>
  </section>`:""}
  <div class="row"><button class="btn" id="againBtn" type="button">다시 풀기</button><button class="btn ghost" id="homeBtn" type="button">처음 화면</button></div>`;
  document.getElementById("againBtn").onclick = start;
  document.getElementById("homeBtn").onclick = renderStart;
}

renderStart();
</script>

</body></html>
